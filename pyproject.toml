[build-system]
requires = ["setuptools>=71.0","coloredlogs"]
build-backend = "setuptools.build_meta"

[project]
name = "qn-util"
version = "0.0.0"

description = "Python tools for Qn network analysis of atomic structures and generation of RMC_POT FNC=3 constraints and topology files."
authors = [
    { name="Kengo NAKADA", email="kengo.nakada@email.com" },
]
readme = "README.md"
# requires-python = ">=3.8"
requires-python = ">=3.10"
dependencies = [
    # my-modules
    # "x_logger",
    "xlogger-py",
    "packmol-util" ,
    # fnc
    "pymatgen",
    # basic
    "dataclasses",
    "coloredlogs",
    "colorlog",
    "pytest",
    "pytest-asyncio",
    "pyyaml",
    "toml",
    # "grpcio",
    "nest_asyncio",
    # pages
    "sphinx",
    "myst-parser",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
    "linkify-it-py"
]

[tool.pytest.ini_options]
pythonpath = ["src"]

# ここでpytestのiniと同じようにオプションが書ける
# 例えばテストマーク、フィルタ、カバレッジなども追記可能

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[project.urls]
Homepage = "https://ohara-lab-su.github.io/qn_util/"
Documentation = "https://ohara-lab-su.github.io/qn_util/"
Repository = "https://github.com/ohara-lab-su/qn_util"
Issues = "https://github.com/ohara-lab-su/qn_util/issues"
